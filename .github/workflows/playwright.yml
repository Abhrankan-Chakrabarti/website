name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily live smoke checks at 04:00 UTC (09:30 IST)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Playwright Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: live
            command: npm run test:live
            report_name: playwright-live-report
            report_path: playwright-live-report/
          - project: local
            command: npm run test:local
            report_name: playwright-local-report
            report_path: playwright-local-report/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pin Chromium / Chrome availability
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify browser binary
        run: |
          which google-chrome || which chrome || true
          (google-chrome --version || chrome --version) || true

      - name: Install Playwright Chromium & dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (${{ matrix.project }})
        run: ${{ matrix.command }}
        env:
          LIVE_URL: https://abhrankan.duckdns.org

      - name: Upload Playwright report on failure (${{ matrix.project }})
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.report_name }}
          path: ${{ matrix.report_path }}
          retention-days: 14
